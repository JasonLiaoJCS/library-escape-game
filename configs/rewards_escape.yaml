# Escape-mode reward shaping.
#
# Design goals (informed by OpenAI Hide-and-Seek, DeepMind Capture-the-Flag, PBRS):
#   * Terminal rewards dominate accumulated shaping. Potential weights are small
#     (sum ~2-3) so the policy optimizes the actual game outcome, not the shaping.
#   * Primary enemy cannot freeload on rule-based support enemies -- capture_pressure
#     now uses distance_primary_enemy, not distance_agents.
#   * Dense progress signals on BOTH sides: primary_distance_delta for the enemy
#     (chase), and goal-distance delta for the player (navigate to notes / exit).
#   * Standing still and oscillating-in-place are strictly worse than moving, even
#     when spotted. Idle and oscillation penalties apply regardless of visibility.
#   * Stalling (timeout) is NOT a win substitute for the enemy; timeout_win is small
#     compared to catch_player so the enemy is pushed to actively catch.

global:
  gamma: 0.99
  clip_range: 320.0
  # Small adversarial mix only -- larger values produced mutual-waiting equilibria
  # where both agents learn to stall because they fear the opponent's shaping.
  zero_sum_mix: 0.10

enemy:
  # --- Terminal (dominant) ---
  catch_player: 300.0
  lose_on_escape: -300.0
  timeout_win: 30.0          # intentionally << catch_player so stalling is worse than catching
  stalemate: -60.0           # stalemate is worse than timeout: punish mutual freeze hard

  # --- Sparse events ---
  detection_event_bonus: 0.0 # not used in escape mode
  player_collect_note_penalty: -14.0
  player_collect_exam_penalty: -4.0
  player_collect_powerup_penalty: -4.0
  player_objective_complete_penalty: -60.0

  # --- Dense shaping (per macro-step) ---
  # Primary enemy must physically see the player -- make this signal strong and
  # decouple it from support enemies. support_* weights are tiny so the primary
  # cannot freeload on teammates' vision.
  primary_visible_per_step: 0.35
  support_visible_per_step: 0.02
  team_visible_ratio_per_step: 0.02
  # NEW: reward for closing physical distance to the player (the "chase" signal).
  # Scaled per grid-cell of net distance reduction in the macro-step.
  chase_progress_per_unit: 0.60
  # NEW: small positive-for-moving-during-search bonus. Breaks "spin in place"
  # local optima when the player is out of sight. Kept small so it does not
  # encourage pointless wandering during chase.
  search_move_per_unit: 0.05

  # --- Soft penalties ---
  time_penalty: -0.015       # active time pressure
  wall_penalty: -0.20
  idle_penalty: -0.10        # ~6x prior value: no-movement is firmly suboptimal

  # --- Timeout / stalemate score-denial bonuses (unused in escape; keep 0) ---
  timeout_score_denial_bonus: 0.0
  stalemate_score_denial_bonus: 0.0

  # --- Potential-based shaping (small weights -- sum ~2.1) ---
  potential:
    enabled: true
    use_primary_distance: true  # key fix: no freeloading on supports
    capture_pressure: 0.80
    team_visibility: 0.20
    objective_denial: 0.50
    exit_guard: 0.50
    encirclement: 0.10

player:
  # --- Terminal ---
  escape: 300.0
  caught: -300.0
  timeout_loss: -30.0
  stalemate: -60.0

  # --- Sparse events ---
  collect_note: 28.0
  collect_exam: 8.0
  collect_coffee: 6.0
  collect_freeze: 10.0
  objective_complete_bonus: 70.0
  detection_event_penalty: 0.0

  # --- Dense shaping ---
  primary_seen_per_step: -0.30
  support_seen_per_step: -0.08
  multi_seen_penalty_per_step: -0.08
  # NEW: reward for shrinking distance to the currently-relevant goal
  # (nearest required collectible, or escape zone once escape is unlocked).
  goal_progress_per_unit: 0.55
  # NEW: when the primary can see the player, reward increasing distance (evasion).
  evade_progress_per_unit: 0.25

  # --- Soft penalties ---
  time_penalty: -0.008
  wall_penalty: -0.20
  idle_penalty: -0.10

  timeout_score_progress_bonus: 0.0
  stalemate_score_progress_bonus: 0.0

  # --- Potential-based shaping (sum ~2.4) ---
  potential:
    enabled: true
    objective_progress: 0.80
    target_navigation: 0.50
    escape_navigation: 0.90
    threat_margin: 0.30
    exit_window: 0.50

anti_exploit:
  no_progress_penalty: -0.08
  # Stationary / oscillation gates -- anti-exploit now fires even when visible,
  # because the "visible-oscillation death spiral" was the dominant failure mode.
  stationary_threshold: 0.14
  oscillation_path_threshold: 0.22
  oscillation_net_threshold: 0.05
  player_stationary_penalty: -0.10
  enemy_stationary_penalty: -0.12
  player_oscillation_penalty: -0.15
  enemy_oscillation_penalty: -0.18
