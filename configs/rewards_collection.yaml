# Collection-mode reward shaping.
#
# Collection mode has no terminal capture/escape -- the dominant payoff is the
# final score at timeout. This file is intentionally redesigned to avoid the
# same pathologies seen in escape mode: spin-in-place visibility farming,
# standing still because fear signals dominate, and oscillation thresholds that
# never actually trigger on real macro-steps.

global:
  gamma: 0.99
  clip_range: 320.0
  zero_sum_mix: 0.0

enemy:
  # --- Terminal-equivalent (score denial at timeout / stalemate) ---
  catch_player: 0.0           # no capture mechanic in collection mode
  lose_on_escape: 0.0
  timeout_win: 0.0            # collection mode always runs to timeout
  stalemate: -80.0
  # Strong end-of-episode signal: the less score the player got, the better.
  timeout_score_denial_bonus: 150.0
  stalemate_score_denial_bonus: 120.0

  # --- Sparse events ---
  detection_event_bonus: 10.0
  player_collect_note_penalty: -18.0
  player_collect_exam_penalty: -34.0
  player_collect_powerup_penalty: -5.0
  player_objective_complete_penalty: -60.0

  # --- Dense shaping ---
  # Visibility should confirm pressure, not become the thing the policy farms.
  primary_visible_per_step: 0.05
  support_visible_per_step: 0.0
  team_visible_ratio_per_step: 0.0
  # Collection enemies still want to close space to the player, but more
  # importantly they should pressure the current scoring target.
  chase_progress_per_unit: 0.85
  chase_alignment_per_step: 0.24
  objective_guard_progress_per_unit: 1.10
  objective_guard_alignment_per_step: 0.28
  exit_guard_progress_per_unit: 0.0
  exit_guard_alignment_per_step: 0.0
  search_move_per_unit: 0.22

  # --- Soft penalties ---
  time_penalty: -0.01
  wall_penalty: -0.15
  idle_penalty: -0.35

  # --- Potential-based shaping: OFF ---
  potential:
    enabled: false
    use_primary_distance: true
    capture_pressure: 0.0
    team_visibility: 0.0
    objective_denial: 0.0
    exit_guard: 0.0
    encirclement: 0.0

player:
  # --- Terminal-equivalent (score progress at timeout / stalemate) ---
  escape: 0.0
  caught: 0.0
  timeout_loss: 0.0
  stalemate: -80.0
  timeout_score_progress_bonus: 190.0
  stalemate_score_progress_bonus: 145.0

  # --- Sparse events (collection mode's true objective) ---
  collect_note: 32.0
  collect_exam: 54.0
  collect_coffee: 10.0
  collect_freeze: 14.0
  objective_complete_bonus: 75.0
  detection_event_penalty: -10.0

  # --- Dense shaping ---
  primary_seen_per_step: -0.04
  support_seen_per_step: 0.0
  multi_seen_penalty_per_step: 0.0
  goal_progress_per_unit: 1.60
  goal_alignment_per_step: 0.36
  evade_progress_per_unit: 0.18
  evade_alignment_per_step: 0.05

  # --- Soft penalties ---
  time_penalty: -0.018
  wall_penalty: -0.20
  idle_penalty: -0.34

  # --- Potential-based shaping: OFF ---
  potential:
    enabled: false
    objective_progress: 0.0
    target_navigation: 0.0
    escape_navigation: 0.0
    threat_margin: 0.0
    exit_window: 0.0

anti_exploit:
  no_progress_penalty: -0.12
  stationary_threshold: 0.05
  oscillation_path_threshold: 0.08
  oscillation_net_threshold: 0.04
  player_stationary_penalty: -0.38
  enemy_stationary_penalty: -0.36
  player_oscillation_penalty: -0.52
  enemy_oscillation_penalty: -0.48
  player_turn_in_place_penalty: -0.22
  enemy_turn_in_place_penalty: -0.28
  player_reverse_turn_penalty: -0.14
  enemy_reverse_turn_penalty: -0.18
