map_path: configs/map.json
reward_path: configs/rewards_escape.yaml

timing:
  render_fps: 60
  physics_hz: 120
  rl_frame_skip: 4
  max_episode_seconds: 60.0
  stalemate_seconds: 6.0

world:
  game_mode: escape
  player_radius: 0.30
  enemy_radius: 0.30
  capture_radius: 0.55
  interaction_radius: 1.10
  player_speed: 4.20
  player_max_turn_rate_deg_per_sec: 900.0
  enemy_speed: 3.70
  coffee_speed_multiplier: 1.50
  coffee_duration_seconds: 15.0
  freeze_duration_seconds: 5.0
  startup_grace_seconds: 0.0
  require_all_notes_to_escape: true
  require_all_exams_to_escape: false

enemy:
  vision_range: 6.0
  vision_angle_deg: 70.0
  chase_speed_multiplier: 1.14
  reaction_interval_seconds: 0.20
  max_turn_rate_deg_per_sec: 720.0

enemy_team:
  support_count: 3
  support_speed_scale: 0.98
  support_vision_range_scale: 0.95
  support_vision_angle_scale: 0.94
  shared_last_seen: true
  shared_detection_cooldown_seconds: 1.00

collectibles:
  notes: 6
  exams: 2
  coffee: 1
  freeze: 1

observation:
  type: vector
  # Default stays conservative. Escape mode can override this to expose
  # relative positions without changing collection-mode stealth behavior.
  partial_observability: true
  normalize: true
  wall_rays: 8
  player_enemy_rays: 3
  max_ray_distance: 8.0

action:
  type: discrete
  continuous_scale: 1.0
  allow_diagonal: true
  allow_noop: false

randomization:
  enabled: false
  min_agent_spawn_distance: 8.0
  player_speed_scale_range: [0.93, 1.07]
  enemy_speed_scale_range: [0.93, 1.10]
  vision_range_scale_range: [0.88, 1.12]
  vision_angle_jitter_deg: 10.0
  support_count_range: [2, 4]

ui:
  show_detection_meter: false
  show_last_seen_marker: false
  show_enemy_mode: false
  show_tactical_panel: false
  show_exit_label: true
