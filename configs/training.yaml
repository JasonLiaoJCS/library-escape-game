single_agent:
  algorithm: maskable_ppo
  total_timesteps: 360000
  n_envs: 8
  learning_rate: 0.0002
  n_steps: 1024
  batch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.18
  ent_coef: 0.015
  vf_coef: 0.5
  device: auto
  enemy_checkpoint_dir: checkpoints/enemy
  player_checkpoint_dir: checkpoints/player_single
  eval_freq: 8192
  checkpoint_freq: 8192
  log_interval_seconds: 1.0
  eval_episodes: 12
  resume_path: ""
  policy:
    hidden_sizes: [256, 256, 128]
    activation_fn: tanh
  vec_normalize:
    enabled: true
    norm_obs: true
    norm_reward: true
    clip_obs: 10.0
    clip_reward: 15.0
  opponent_curriculum:
    use_history_pool: true
    max_history_pool: 12
    random_weight: 0.15
    heuristic_weight: 0.45
    history_weight: 0.40

self_play:
  algorithm: league_maskable_ppo
  rounds: 5
  timesteps_per_round: 140000
  n_envs: 4
  learning_rate: 0.0002
  n_steps: 1024
  batch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.18
  ent_coef: 0.015
  vf_coef: 0.5
  opponent_pool_size: 8
  checkpoint_root_dir: checkpoints/selfplay
  eval_freq: 8192
  checkpoint_freq: 8192
  log_interval_seconds: 1.0
  policy:
    hidden_sizes: [256, 256, 128]
    activation_fn: tanh
  vec_normalize:
    enabled: true
    norm_obs: true
    norm_reward: true
    clip_obs: 10.0
    clip_reward: 15.0
  opponent_curriculum:
    bootstrap_random_weight: 0.15
    bootstrap_heuristic_weight: 0.85
    latest_weight: 0.35
    historical_weight: 0.65
    max_history_pool: 8
    mappo_recipe:
      enabled: false
      external_command: ""
      notes: "For a full external MAPPO backend, point this command at an installed official MAPPO runner."

evaluation:
  episodes: 20
  render_fps: 60

presets:
  fast:
    single_agent:
      total_timesteps: 140000
      n_envs: 4
      eval_freq: 4096
      checkpoint_freq: 4096
      n_steps: 768
    self_play:
      rounds: 2
      timesteps_per_round: 70000
      n_envs: 2
      eval_freq: 4096
      checkpoint_freq: 4096
      n_steps: 768
    env_overrides:
      timing:
        rl_frame_skip: 6
      randomization:
        enabled: true
    env_overrides_by_game_mode:
      collection:
        enemy_team:
          support_count: 3
        randomization:
          support_count_range: [2, 4]
      escape:
        enemy_team:
          support_count: 1
        randomization:
          support_count_range: [1, 2]
    train_overrides_by_game_mode:
      collection:
        ent_coef: 0.018
      escape:
        ent_coef: 0.020
