[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "library-escape"
version = "0.1.0"
description = "Continuous-time stealth game ported from SDL2 to Python with RL support."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Codex" },
]
dependencies = [
  "numpy>=1.26,<3.0",
  "pygame-ce>=2.5.2",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
rl = [
  "gymnasium>=0.29.1",
  "pettingzoo>=1.24.3",
  "supersuit>=3.9.3",
  "stable-baselines3>=2.3.2",
  "sb3-contrib>=2.3.0",
  "tensorboard>=2.16.2",
  "torch>=2.3.1",
]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
]

[project.scripts]
library-escape-play = "library_escape.play.human_vs_ai:main"
library-escape-ai-vs-ai = "library_escape.play.ai_vs_ai:main"
library-escape-train-enemy = "library_escape.train.train_enemy:main"
library-escape-train-player = "library_escape.train.train_player:main"
library-escape-train-selfplay = "library_escape.train.train_selfplay:main"
library-escape-gui = "library_escape.gui.app:main"
library-escape-replay = "library_escape.replay.viewer:main"

[tool.setuptools.packages.find]
include = ["library_escape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
